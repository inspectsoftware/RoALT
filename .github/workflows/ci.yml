name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc and the Vite build, which also gives tauri::generate_context! its ../dist.
      - run: npm run build
      - run: npm run test:sounds && npm run test:news && npm run test:liquid && npm run test:look
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Committed TypeScript bindings match the Rust types
        shell: bash
        run: |
          changed="$(git status --porcelain -- src/bindings)"
          if [ -n "$changed" ]; then echo "$changed"; echo "Run npm run bindings and commit src/bindings."; exit 1; fi
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

  remote-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/remote
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/remote/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  remote-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/remote-relay
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/remote-relay
      - run: cargo test --locked
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
