name: Release

# On a v* tag, or by hand (Actions > Release > Run workflow): builds the installer, then puts it
# with its SHA-256 on a draft release v<version>. Nothing is signed and nothing is published: a
# maintainer reviews the draft and publishes it, which creates the tag when a manual run made it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          $version = (Get-Content -Raw src-tauri\tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            echo "::error::tag $env:GITHUB_REF_NAME is not v$version, the version in src-tauri/tauri.conf.json: tag v$version instead, or set the version in tauri.conf.json, package.json and src-tauri/Cargo.toml first"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup 6.6+
        # Installs it, or upgrades a preinstalled older 6.x (the .iss needs 6.6).
        run: choco upgrade innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist-installer/RoALT-Setup-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Draft release with SHA-256 sums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.windows.outputs.tag }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          Unsigned build: code signing comes later. The installer's SHA-256 is below and in SHA256SUMS.txt.

          - **Windows** 10 1809 or later, or Windows 11, x64: RoALT-Setup-$VERSION.exe. SmartScreen warns on first run: More info → Run anyway.
          - Needs the Microsoft Edge WebView2 Runtime (Windows 11 has it). Setup checks, and offers Microsoft's download when it is missing.

          ~~~
          $(cat SHA256SUMS.txt)
          ~~~
          EOF
          # A manual run must not attach a build of one commit to a tag on another.
          if tag_sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null) && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG is at $tag_sha, not $GITHUB_SHA: raise the version, or run the workflow from the tag"
            exit 1
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published: raise the version for a new release"
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file ../notes.md
          else
            gh release create "$TAG" ./* --draft --target "$GITHUB_SHA" --title "RoALT $VERSION" --notes-file ../notes.md
          fi
