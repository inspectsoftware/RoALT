[package]
name = "roalt-remote-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Stateless end-to-end encrypted WebSocket relay for RoALT Remote Dashboard"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dashmap = "6"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.26"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
