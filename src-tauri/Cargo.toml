[package]
name = "roalt"
version = "0.1.0"
description = "Local-only Roblox account manager"
authors = ["inspectsoftware"]
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6"
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
ts-rs = "12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Security_Credentials_UI",
  "Foundation",
] }
windows-future = "0.3"
webview2-com = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
