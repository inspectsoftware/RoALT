<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AltDock: two client windows stacked on a dock bar. Same shapes as `Logo` (src/ui/Icon.tsx),
       there in an 18-unit box: back window 6,2 10.5x7; front window 1.5,5 10.5x7.5; dock 1.5,14 15x2.5. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2333"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DCE6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#ground)"/>
  <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#FFF" stroke-opacity="0.06" stroke-width="2"/>
  <rect x="405" y="263" width="373" height="249" rx="53" fill="url(#accent)"/>
  <rect x="245" y="370" width="373" height="267" rx="53" fill="url(#window)" filter="url(#lift)"/>
  <rect x="245" y="690" width="533" height="89" rx="44.5" fill="#E2E8F0" fill-opacity="0.92"/>
</svg>
