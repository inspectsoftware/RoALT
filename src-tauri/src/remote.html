<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>RoALT</title>
<style>
:root{--bg:#050506;--panel:#0a0b0d;--raised:#0f1114;--line:#1b1e23;--line-strong:#2b3038;--text:#eceef1;--dim:#9ba3ae;--accent:#c6f432;--on-accent:#0a0b0d;--blue:#7ab0ff;--orange:#ffa05c;--red:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
h1 b{color:var(--accent)}
h2{font:600 11px/1 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);padding:12px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--dim);font:12px ui-monospace,Consolas,monospace}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px;background:var(--dim)}
.ingame{background:var(--accent)}.joining,.starting{background:var(--blue)}.disconnected{background:var(--orange)}
button{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line-strong);padding:7px 12px;cursor:pointer;min-height:36px}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.danger{border-color:var(--red);color:var(--red)}
input[type=text],input[type=password],input[inputmode]{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line-strong);padding:8px 10px;width:100%;min-height:38px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.acc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
label.acc:last-child{border-bottom:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.empty{color:var(--dim);padding:8px 0}
#msg{min-height:20px;margin:8px 0;color:var(--dim)}
#msg.err{color:var(--red)}
.login{max-width:320px;margin:15vh auto 0;display:flex;flex-direction:column;gap:10px}
.actions{display:flex;gap:8px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <form id="login" class="login" hidden>
    <h1>Ro<b>ALT</b></h1>
    <span class="meta">Enter the PIN shown in RoALT, Settings, Security.</span>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN" aria-label="PIN" maxlength="16">
    <button class="primary" type="submit">Sign in</button>
    <div id="loginMsg" class="meta"></div>
  </form>

  <div id="app" hidden>
    <header>
      <h1>Ro<b>ALT</b></h1>
      <button class="danger" id="killAll">Kill all</button>
    </header>
    <div id="msg" role="status"></div>

    <h2>Running</h2>
    <div class="card" id="clients"><div class="empty">Loading…</div></div>

    <h2>Launch</h2>
    <div class="card">
      <input type="text" id="target" placeholder="Game, server or private server link" aria-label="Game link">
      <div id="accounts" style="margin-top:8px"></div>
      <div class="actions"><button class="primary" id="launch">Launch ticked</button></div>
    </div>
  </div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
// The next poll (null: signed out); `busy`: actions in flight, during which rows aren't rebuilt.
let timer = null, busy = 0;

async function call(path, body) {
  const init = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-RoALT": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, init);
  let j = null;
  try { j = await r.json(); } catch (_) {}
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Sign in again."); }
  if (!r.ok) throw new Error((j && j.error) || "Request failed (" + r.status + ").");
  return j;
}

function say(text, err) { const m = $("#msg"); m.textContent = text || ""; m.className = err ? "err" : ""; }

function showLogin() {
  clearTimeout(timer); timer = null;
  $("#app").hidden = true; $("#login").hidden = false; $("#pin").focus();
}

function uptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + " h " + String(m).padStart(2, "0") + " min" : m + " min";
}

const STATE = { starting: "Starting", joining: "Joining", inGame: "In game", disconnected: "Disconnected" };

async function refresh() {
  const list = await call("/api/state");
  const box = $("#clients");
  box.replaceChildren();
  if (!list.length) box.append(el("div", "empty", "No client is running."));
  for (const c of list) {
    const row = el("div", "row");
    const info = el("div", "grow");
    const name = el("div", "name");
    const dot = el("span", "dot " + c.state.toLowerCase());
    name.append(dot, document.createTextNode(c.account));
    const bits = [STATE[c.state] || c.state, c.game || "", uptime(c.uptimeS)];
    if (c.cpuPct != null) bits.push(c.cpuPct.toFixed(0) + "% CPU");
    if (c.ramMb != null) bits.push(Math.round(c.ramMb) + " MB");
    if (c.throttled) bits.push("throttled");
    info.append(name, el("div", "meta", bits.filter(Boolean).join(" · ")));
    const close = el("button", "", "Close");
    close.onclick = () => act(close, "/api/close", { id: c.id, force: false }, "Asked " + c.account + " to close.");
    const force = el("button", "danger", "Force");
    force.onclick = () => confirm("Terminate " + c.account + "'s client?") && act(force, "/api/close", { id: c.id, force: true }, c.account + " terminated.");
    row.append(info, close, force);
    box.append(row);
  }
}

async function loadAccounts() {
  const list = await call("/api/accounts");
  const box = $("#accounts");
  box.replaceChildren();
  if (!list.length) box.append(el("div", "empty", "No accounts yet."));
  for (const a of list) {
    const label = el("label", "acc");
    const cb = el("input"); cb.type = "checkbox"; cb.value = String(a.id); cb.disabled = a.status !== "valid" || a.running;
    const txt = el("span", "grow", a.name);
    label.append(cb, txt, el("span", "meta", a.running ? "running" : a.status === "valid" ? "" : a.status));
    box.append(label);
  }
}

async function act(btn, path, body, done) {
  btn.disabled = true; busy++;
  try { await call(path, body); say(done); refresh().catch(() => {}); }
  catch (e) { say(e.message, true); }
  finally { btn.disabled = false; busy--; }
}

async function start() {
  $("#login").hidden = true; $("#app").hidden = false;
  await Promise.all([refresh(), loadAccounts()]);
  poll();
}

// Every 3 s after the last answer, only while the page is shown.
function poll() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (document.visibilityState === "visible" && !busy) await refresh().catch((e) => say(e.message, true));
    if (timer !== null) poll();
  }, 3000);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timer !== null && !busy) refresh().catch((e) => say(e.message, true));
});

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  const pin = $("#pin").value.trim();
  if (!pin) return;
  try { await call("/api/login", { pin }); $("#pin").value = ""; $("#loginMsg").textContent = ""; await start(); }
  catch (err) { $("#loginMsg").textContent = err.message; }
};

$("#launch").onclick = () => {
  const ids = [...document.querySelectorAll("#accounts input:checked")].map((c) => Number(c.value));
  const target = $("#target").value.trim();
  if (!ids.length) return say("Tick at least one account.", true);
  if (!target) return say("Paste a game link first.", true);
  act($("#launch"), "/api/launch", { accountIds: ids, target }, "Launching " + ids.length + (ids.length > 1 ? " accounts." : " account.")).then(() => loadAccounts().catch(() => {}));
};

$("#killAll").onclick = () => confirm("Terminate every Roblox client on the PC?") && act($("#killAll"), "/api/kill-all", {}, "Every Roblox client was terminated.");

start().catch(() => showLogin());
</script>
</body>
</html>
